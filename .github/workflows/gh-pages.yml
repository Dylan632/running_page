name: Publish GitHub Pages

on:
  workflow_dispatch:
    inputs:
      deployment_mode:
        description: Publish only the canonical redirect, or rebuild the legacy full site
        required: true
        type: choice
        options:
          - redirect
          - full
        default: redirect
      source_sha:
        description: Exact source SHA (defaults to the workflow SHA)
        required: false
        type: string
        default: ''
      canonical_origin:
        description: Canonical Vercel origin (defaults to VERCEL_CANONICAL_ORIGIN)
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      deployment_mode:
        required: false
        type: string
        default: redirect
      source_sha:
        required: false
        type: string
        default: ''
      ci_preverified:
        required: false
        type: boolean
        default: false
      canonical_origin:
        required: false
        type: string
        default: ''

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CANONICAL_ORIGIN: ${{ inputs.canonical_origin || vars.VERCEL_CANONICAL_ORIGIN }}

jobs:
  prepare_redirect:
    if: inputs.deployment_mode == 'redirect'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the exact source SHA
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Verify successful CI belongs to the exact SHA
        if: inputs.ci_preverified != true
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/verify-github-ci.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$EXPECTED_SOURCE_SHA" \
            --branch master

      - name: Build the canonical redirect
        run: |
          node scripts/build-legacy-redirect.mjs \
            --origin "$CANONICAL_ORIGIN" \
            --base-path "/${{ github.event.repository.name }}" \
            --output "$RUNNER_TEMP/pages-redirect"

      - name: Upload redirect Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: pages-artifact
          path: ${{ runner.temp }}/pages-redirect

  build_full:
    if: inputs.deployment_mode == 'full'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the exact source SHA
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify successful CI belongs to the exact SHA
        if: inputs.ci_preverified != true
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/verify-github-ci.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$EXPECTED_SOURCE_SHA" \
            --branch master

      - name: Verify committed artifacts for all activity modes
        run: |
          node scripts/generate-activity-artifacts.mjs verify \
            --data-output public/data \
            --assets-output assets

      - name: Run non-mutating checks and build the exact SHA
        env:
          PATH_PREFIX: /${{ github.event.repository.name }}/
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain --untracked-files=all > "$RUNNER_TEMP/before-delivery-status"
          pnpm run ci
          git status --porcelain --untracked-files=all > "$RUNNER_TEMP/after-delivery-status"
          cmp "$RUNNER_TEMP/before-delivery-status" "$RUNNER_TEMP/after-delivery-status"

      - name: Upload verified full Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: pages-artifact
          path: ./dist

  deploy:
    needs:
      - prepare_redirect
      - build_full
    if: ${{ !cancelled() && (needs.prepare_redirect.result == 'success' || needs.build_full.result == 'success') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-artifact
