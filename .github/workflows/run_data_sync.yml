name: Publish Running Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - master
    paths:
      - .github/workflows/run_data_sync.yml
      - scripts/generate-activity-artifacts.mjs
      - scripts/lib/activity-policy.mjs
      - scripts/publish-activity-data.mjs
      - src/modules/activity/activity-profiles.json
      - run_page/activity_snapshot.py
      - run_page/filter_activity_data.py
      - run_page/keep_http.py
      - run_page/keep_sync.py
      - run_page/gen_svg.py
      - run_page/generator/**
      - run_page/gpxtrackposter/**
      - requirements.txt

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

concurrency:
  group: run-data-sync-${{ github.ref }}
  cancel-in-progress: false

env:
  RUN_TYPE: keep
  ATHLETE: Dylan
  BIRTHDAY_MONTH: 1989-03
  IGNORE_START_END_RANGE: 10
  IGNORE_POLYLINE: 'ktjrFoemeU~IorGq}DeB'
  IGNORE_RANGE: 10
  USE_CLOUDFLARE_WARP: false
  SAVE_TO_PARQENT: false

jobs:
  sync:
    name: Validate and publish running data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.push.outputs.changed }}
      source_sha: ${{ steps.push.outputs.source_sha }}
    steps:
      - name: Check out the writable master branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv with its built-in cache
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Install Python dependencies
        run: uv pip install --system -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Capture one publication timestamp and the last-known-good running snapshot
        shell: bash
        run: |
          set -euo pipefail
          PUBLICATION_TIMESTAMP="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "PUBLICATION_TIMESTAMP=$PUBLICATION_TIMESTAMP" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/.activity-last-known-good/running"
          cp public/data/running/metadata.json \
            "$RUNNER_TEMP/.activity-last-known-good/running/activities.json"

      - name: Prepare an isolated running candidate
        run: |
          rm -f run_page/data.db src/static/activities.json imported.json
          rm -rf activities GPX_OUT TCX_OUT FIT_OUT
          mkdir -p activities GPX_OUT TCX_OUT FIT_OUT src/static

      - name: Sync Keep running data
        run: |
          python run_page/keep_sync.py \
            "${{ secrets.KEEP_MOBILE }}" \
            "${{ secrets.KEEP_PASSWORD }}" \
            --with-gpx \
            --sync-types running

      - name: Validate the complete running candidate
        run: |
          python run_page/activity_snapshot.py validate \
            --json src/static/activities.json \
            --db run_page/data.db \
            --previous-json "$RUNNER_TEMP/.activity-last-known-good/running/activities.json" \
            --metadata "$RUNNER_TEMP/running-activity-snapshot.json"

      - name: Generate profile-driven running artifacts
        run: |
          node scripts/generate-activity-artifacts.mjs generate \
            --mode running \
            --input src/static/activities.json \
            --published-at "$PUBLICATION_TIMESTAMP" \
            --data-output public/data \
            --assets-output assets \
            --python python \
            --athlete "$ATHLETE" \
            --birth-month "$BIRTHDAY_MONTH"

      - name: Verify the running namespace before changing the repository
        run: |
          node scripts/generate-activity-artifacts.mjs verify \
            --data-output public/data \
            --assets-output assets

      - name: Commit the validated running artifacts atomically
        id: push
        shell: bash
        run: |
          set -euo pipefail
          git config --local user.email 'action@github.com'
          git config --local user.name 'GitHub Action'
          git add public/data/running assets/running
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m 'publish validated running artifacts'
            for attempt in 1 2 3; do
              set +e
              git push
              push_status=$?
              set -e
              if (( push_status == 0 )); then
                break
              fi
              if (( attempt == 3 )); then
                echo "::error::Unable to push the validated publication after three attempts."
                exit 1
              fi
              git fetch origin master
              git rebase --autostash origin/master
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: activity-snapshots-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/running-activity-snapshot.json
          retention-days: 30

  ci:
    if: needs.sync.outputs.changed == 'true'
    needs: sync
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.sync.outputs.source_sha }}
      mode: release
    secrets: inherit

  deploy:
    if: needs.ci.result == 'success'
    needs: [sync, ci]
    uses: ./.github/workflows/vercel-production.yml
    with:
      source_sha: ${{ needs.sync.outputs.source_sha }}
      ci_preverified: true
    secrets: inherit
