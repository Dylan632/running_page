name: Deploy verified SHA to Vercel Production

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact 40-character master SHA to deploy
        required: true
        type: string
    secrets:
      VERCEL_TOKEN:
        required: true
      VERCEL_ORG_ID:
        required: true
      VERCEL_PROJECT_ID:
        required: true
      VERCEL_AUTOMATION_BYPASS_SECRET:
        required: true
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character master SHA with successful CI
        required: true
        type: string
concurrency:
  group: vercel-production
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      CANONICAL_ORIGIN: ${{ vars.VERCEL_CANONICAL_ORIGIN }}

    steps:
      - name: Fail closed when production configuration is incomplete
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for required_name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_AUTOMATION_BYPASS_SECRET; do
            if [ -z "${!required_name:-}" ]; then
              echo "::error::$required_name is required as a GitHub Actions secret."
              exit 1
            fi
          done
          if [[ ! "$CANONICAL_ORIGIN" =~ ^https://[^/]+$ ]]; then
            echo "::error::VERCEL_CANONICAL_ORIGIN is required as an https origin repository variable."
            exit 1
          fi
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::The production source must be an exact 40-character SHA."
            exit 1
          fi

      - name: Check out the exact CI source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove the source is still current master
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          remote_master_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          test "$checked_out_sha" = "$SOURCE_SHA"
          if [ "$remote_master_sha" != "$SOURCE_SHA" ]; then
            echo "::error::master advanced to $remote_master_sha; refusing to deploy stale SHA $SOURCE_SHA."
            exit 1
          fi

      - name: Verify successful CI for manual deployments
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-github-ci.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$SOURCE_SHA" \
            --branch master

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Re-run complete delivery checks for manual deployments
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain --untracked-files=all > "$RUNNER_TEMP/before-delivery-status"
          pnpm run ci
          git status --porcelain --untracked-files=all > "$RUNNER_TEMP/after-delivery-status"
          cmp "$RUNNER_TEMP/before-delivery-status" "$RUNNER_TEMP/after-delivery-status"

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@50.28.0

      - name: Pull production project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build immutable production output
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_GIT_COMMIT_SHA: ${{ env.SOURCE_SHA }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Capture current production for automatic rollback
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          node scripts/capture-vercel-production.mjs \
            --origin "$CANONICAL_ORIGIN" \
            --output "$RUNNER_TEMP/vercel-cutover/previous-production.json"

      - name: Build legacy GitHub Pages redirect artifact
        run: |
          node scripts/build-legacy-redirect.mjs \
            --origin "$CANONICAL_ORIGIN" \
            --base-path /cycling_page \
            --output "$RUNNER_TEMP/vercel-cutover/legacy-pages-redirect"

      - name: Stage the prebuilt exact SHA without assigning domains
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_GIT_COMMIT_SHA: ${{ env.SOURCE_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(
            vercel deploy --prebuilt --prod --skip-domain \
              --meta githubCommitSha="$SOURCE_SHA" \
              --yes \
              --token="$VERCEL_TOKEN"
          )"
          deployment_url="$(printf '%s\n' "$deployment_url" | tail -n 1)"
          if [[ ! "$deployment_url" =~ ^https://[^[:space:]]+\.vercel\.app$ ]]; then
            echo "::error::Vercel did not return a valid immutable deployment URL."
            exit 1
          fi
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Record the cutover and rollback target
        run: |
          node scripts/create-cutover-record.mjs \
            --source-sha "$SOURCE_SHA" \
            --canonical-origin "$CANONICAL_ORIGIN" \
            --deployment-url "${{ steps.deploy.outputs.url }}" \
            --previous "$RUNNER_TEMP/vercel-cutover/previous-production.json" \
            --output "$RUNNER_TEMP/vercel-cutover/cutover-record.json"

      - name: Monitor the staged production artifact
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          BROWSER_BIN: google-chrome
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/monitor-deployment.mjs \
            --origin "$DEPLOYMENT_URL" \
            --max-data-age-hours 30 \
            --attempts 8 \
            --retry-delay-ms 5000 \
            --require-cache \
            --require-browser 2>&1 | \
            tee "$RUNNER_TEMP/vercel-cutover/staged-monitor.log"

      - name: Promote, verify canonical identity, or roll back
        env:
          BROWSER_BIN: google-chrome
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          pre_promotion_master_sha="$(
            git ls-remote origin refs/heads/master | awk '{print $1}'
          )"
          if [ "$pre_promotion_master_sha" != "$SOURCE_SHA" ]; then
            echo "::error::master advanced to $pre_promotion_master_sha before promotion; refusing stale SHA $SOURCE_SHA."
            exit 1
          fi

          previous_file="$RUNNER_TEMP/vercel-cutover/previous-production.json"
          previous_url="$(
            node -e "const snapshot=require(process.argv[1]); process.stdout.write(snapshot.deploymentUrl)" \
              "$previous_file"
          )"
          previous_sha="$(
            node -e "const snapshot=require(process.argv[1]); process.stdout.write(snapshot.sourceSha || '')" \
              "$previous_file"
          )"
          rollback_token="$VERCEL_TOKEN"
          cutover_verified=false

          rollback_on_failure() {
            status=$?
            trap - EXIT
            if [ "$cutover_verified" = true ] && [ "$status" -eq 0 ]; then
              exit 0
            fi

            echo "::error::Production cutover failed; restoring alias to $previous_url."
            set +e
            vercel promote "$previous_url" \
              --yes \
              --scope="$VERCEL_ORG_ID" \
              --token="$rollback_token"
            rollback_status=$?
            rollback_args=(
              --origin "$CANONICAL_ORIGIN"
              --expected-deployment-url "$previous_url"
              --output "$RUNNER_TEMP/vercel-cutover/rollback-production.json"
            )
            if [ -n "$previous_sha" ]; then
              rollback_args+=(--expected-source-sha "$previous_sha")
            fi
            VERCEL_TOKEN="$rollback_token" \
              node scripts/capture-vercel-production.mjs "${rollback_args[@]}"
            alias_status=$?
            env -u VERCEL_TOKEN node scripts/monitor-deployment.mjs \
              --origin "$CANONICAL_ORIGIN" \
              --max-data-age-hours 30 \
              --attempts 8 \
              --retry-delay-ms 5000 \
              --require-cache \
              --require-browser 2>&1 | \
              tee "$RUNNER_TEMP/vercel-cutover/rollback-monitor.log"
            monitor_status=${PIPESTATUS[0]}
            if [ "$rollback_status" -ne 0 ] || [ "$alias_status" -ne 0 ] || [ "$monitor_status" -ne 0 ]; then
              echo "::error::Automatic rollback verification failed."
            else
              echo "::notice::Automatic rollback was verified."
            fi
            exit 1
          }
          trap rollback_on_failure EXIT

          vercel promote "$DEPLOYMENT_URL" \
            --yes \
            --scope="$VERCEL_ORG_ID" \
            --token="$rollback_token"
          VERCEL_TOKEN="$rollback_token" \
            node scripts/capture-vercel-production.mjs \
              --origin "$CANONICAL_ORIGIN" \
              --expected-deployment-url "$DEPLOYMENT_URL" \
              --expected-source-sha "$SOURCE_SHA" \
              --output "$RUNNER_TEMP/vercel-cutover/promoted-production.json"
          env -u VERCEL_TOKEN node scripts/monitor-deployment.mjs \
            --origin "$CANONICAL_ORIGIN" \
            --max-data-age-hours 30 \
            --attempts 8 \
            --retry-delay-ms 5000 \
            --require-cache \
            --require-browser 2>&1 | \
            tee "$RUNNER_TEMP/vercel-cutover/canonical-monitor.log"
          cutover_verified=true

      - name: Upload cutover and rollback artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-cutover-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/vercel-cutover
          if-no-files-found: warn
          retention-days: 90

      - name: Write deployment summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Verified Vercel production"
            echo
            echo "- Source SHA: \`$SOURCE_SHA\`"
            echo "- Immutable deployment: ${{ steps.deploy.outputs.url }}"
            echo "- Canonical origin: $CANONICAL_ORIGIN"
            echo "- /running, /cycling, and /hiking passed HTTP, data freshness, cache, and browser error probes."
            echo "- Legacy Pages redirect and rollback metadata were saved as an artifact."
          } >> "$GITHUB_STEP_SUMMARY"

  publish-legacy-redirect:
    needs: deploy
    if: needs.deploy.result == 'success'
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/gh-pages.yml
    with:
      deployment_mode: redirect
      source_sha: ${{ inputs.source_sha }}
      ci_preverified: true
      canonical_origin: ${{ vars.VERCEL_CANONICAL_ORIGIN }}
