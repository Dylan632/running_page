name: CI

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact 40-character master SHA to verify for a release
        required: true
        type: string
  push:
    paths-ignore:
      - 'public/data/**'
      - 'assets/running/**'
      - 'assets/cycling/**'
      - 'assets/hiking/**'
  pull_request:
  workflow_dispatch:

jobs:
  python_lint_and_test:
    if: github.event_name != 'workflow_call'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        id: setup_python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'requirements-dev.txt'

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Run GPX sync test
        run: |
          # make sure the gpx_sync.py script is executable
          python run_page/gpx_sync.py

      - name: Run Python unit tests
        run: python -m unittest discover -s . -p 'test_*.py'

      - name: Check formatting (black)
        run: black . --diff --color && black . --check

      - name: Lint with Ruff
        run: ruff check .

  node_lint_and_test:
    if: github.event_name != 'workflow_call'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run complete delivery checks
        shell: bash
        env:
          VISUAL_ARTIFACT_DIR: ${{ runner.temp }}/visual-regression/node-${{ matrix.node }}
        run: |
          set -euo pipefail
          git status --porcelain --untracked-files=all > "$RUNNER_TEMP/before-delivery-status"
          pnpm run ci
          git status --porcelain --untracked-files=all > "$RUNNER_TEMP/after-delivery-status"
          cmp "$RUNNER_TEMP/before-delivery-status" "$RUNNER_TEMP/after-delivery-status"

      - name: Upload responsive visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-visuals-node-${{ matrix.node }}
          path: ${{ runner.temp }}/visual-regression/node-${{ matrix.node }}
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'workflow_call'
    name: Verify and build release SHA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact published SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove the source is still current master
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          remote_master_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          test "$checked_out_sha" = "${{ inputs.source_sha }}"
          if [ "$remote_master_sha" != "${{ inputs.source_sha }}" ]; then
            echo "::error::master advanced to $remote_master_sha; refusing stale SHA ${{ inputs.source_sha }}."
            exit 1
          fi

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Run canonical Python checks
        run: |
          set -euo pipefail
          python run_page/gpx_sync.py
          python -m unittest discover -s . -p 'test_*.py'
          black . --diff --color
          black . --check
          ruff check .

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Run canonical frontend checks and build
        shell: bash
        env:
          VISUAL_ARTIFACT_DIR: ${{ runner.temp }}/visual-regression/release
        run: |
          set -euo pipefail
          git status --porcelain --untracked-files=all > "$RUNNER_TEMP/before-delivery-status"
          pnpm run ci
          git status --porcelain --untracked-files=all > "$RUNNER_TEMP/after-delivery-status"
          cmp "$RUNNER_TEMP/before-delivery-status" "$RUNNER_TEMP/after-delivery-status"

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-visuals-${{ github.run_id }}
          path: ${{ runner.temp }}/visual-regression/release
          if-no-files-found: warn
          retention-days: 14
