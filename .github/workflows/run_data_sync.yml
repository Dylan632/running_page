name: Run Data Sync

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/run_data_sync.yml
      - run_page/keep_sync.py
      - run_page/gen_svg.py
      - requirements.txt

env:
  # Personal running-page config
  RUN_TYPE: keep
  ATHLETE: WangFan
  TITLE: WangFan's Running Records
  MIN_GRID_DISTANCE: 10
  TITLE_GRID: Over 10km Runs

  IGNORE_START_END_RANGE: 10
  IGNORE_POLYLINE: 'ktjrFoemeU~IorGq}DeB'
  IGNORE_RANGE: 10
  USE_CLOUDFLARE_WARP: false
  SAVE_DATA_IN_GITHUB_CACHE: false
  DATA_CACHE_PREFIX: 'track_data'
  BUILD_GH_PAGES: true
  SAVE_TO_PARQENT: false
  GENERATE_MONTH_OF_LIFE: true
  BIRTHDAY_MONTH: 1989-03

jobs:
  sync:
    name: Sync Keep running data only
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Clean old generated activity data
        run: |
          rm -f run_page/data.db src/static/activities.json imported.json
          rm -rf activities GPX_OUT TCX_OUT FIT_OUT
          mkdir -p activities GPX_OUT TCX_OUT FIT_OUT assets src/static
          find assets -maxdepth 1 -name '*.svg' ! -name 'start.svg' ! -name 'end.svg' -delete

      - name: Run sync Keep script for running only
        run: |
          python run_page/keep_sync.py ${{ secrets.KEEP_MOBILE }} ${{ secrets.KEEP_PASSWORD }} --with-gpx --sync-types running

      - name: Make svg GitHub profile
        env:
          TITLE: ${{ env.TITLE }}
          TITLE_GRID: ${{ env.TITLE_GRID }}
          ATHLETE: ${{ env.ATHLETE }}
          MIN_GRID_DISTANCE: ${{ env.MIN_GRID_DISTANCE }}
        run: |
          python run_page/gen_svg.py --from-db --title "$TITLE" --type github --github-style "align-firstday" --athlete "$ATHLETE" --special-distance 10 --special-distance2 20 --special-color yellow --special-color2 red --output assets/github.svg --use-localtime --min-distance 0.5
          python run_page/gen_svg.py --from-db --title "$TITLE_GRID" --type grid --athlete "$ATHLETE" --output assets/grid.svg --special-color yellow --special-color2 red --special-distance 20 --special-distance2 40 --use-localtime --min-distance "$MIN_GRID_DISTANCE"
          python run_page/gen_svg.py --from-db --type circular --use-localtime
          for year in $(seq 2015 $(date +"%Y")); do
            python run_page/gen_svg.py --from-db --year "$year" --language zh_CN --title "${year} Running" --type github --github-style "align-firstday" --athlete "$ATHLETE" --special-distance 10 --special-distance2 20 --special-color yellow --special-color2 red --output "assets/github_${year}.svg" --use-localtime --min-distance 0.5
          done

      - name: Make month of life
        if: env.GENERATE_MONTH_OF_LIFE == 'true'
        run: |
          python run_page/gen_svg.py --from-db --type monthoflife --birth "${{ env.BIRTHDAY_MONTH }}" --special-color "#f9d367" --special-color2 "#f0a1a8" --output assets/mol_running.svg --use-localtime --athlete "${{ env.ATHLETE }}" --title "Runner Month of Life" --sport-type running
          python run_page/gen_svg.py --from-db --type monthoflife --birth "${{ env.BIRTHDAY_MONTH }}" --special-color "#f9d367" --special-color2 "#f0a1a8" --output assets/mol.svg --use-localtime --athlete "${{ env.ATHLETE }}" --title "Month of Life" --sport-type all

      - name: Make year summary
        if: env.GENERATE_MONTH_OF_LIFE == 'true'
        run: |
          python run_page/gen_svg.py --from-db --type year_summary --output assets/year_summary.svg --athlete "${{ env.ATHLETE }}"

      - name: Drop raw activity files before committing
        run: |
          rm -rf activities GPX_OUT TCX_OUT FIT_OUT
          mkdir -p activities GPX_OUT TCX_OUT FIT_OUT
          touch activities/.gitkeep GPX_OUT/.gitkeep TCX_OUT/.gitkeep FIT_OUT/.gitkeep

      - name: Push regenerated running data
        run: |
          git config --local user.email 'action@github.com'
          git config --local user.name 'GitHub Action'
          git add -A
          git commit -m 'rebuild running data only' || echo 'nothing to commit'
          git push || echo 'nothing to push'
