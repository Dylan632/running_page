name: Publish Activity Data

on:
  workflow_dispatch:
    inputs:
      pages_mode:
        description: Keep Pages unchanged, publish its canonical redirect, or rebuild it fully
        required: true
        type: choice
        options:
          - none
          - redirect
          - full
        default: none
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - master
    paths:
      - .github/workflows/run_data_sync.yml
      - scripts/generate-activity-artifacts.mjs
      - scripts/publish-activity-data.mjs
      - src/modules/activity/activity-profiles.json
      - run_page/activity_snapshot.py
      - run_page/filter_activity_data.py
      - run_page/keep_http.py
      - run_page/keep_sync.py
      - run_page/gen_svg.py
      - run_page/gpxtrackposter/**
      - requirements.txt

permissions:
  contents: write

concurrency:
  group: run-data-sync-${{ github.ref }}
  cancel-in-progress: false

env:
  RUN_TYPE: keep
  ATHLETE: Dylan
  BIRTHDAY_MONTH: 1989-03
  IGNORE_START_END_RANGE: 10
  IGNORE_POLYLINE: 'ktjrFoemeU~IorGq}DeB'
  IGNORE_RANGE: 10
  USE_CLOUDFLARE_WARP: false
  SAVE_TO_PARQENT: false

jobs:
  sync:
    name: Validate and publish both activity modes
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.push.outputs.source_sha }}
    steps:
      - name: Check out the writable master branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Capture one publication timestamp and both last-known-good snapshots
        shell: bash
        run: |
          set -euo pipefail
          PUBLICATION_TIMESTAMP="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "PUBLICATION_TIMESTAMP=$PUBLICATION_TIMESTAMP" >> "$GITHUB_ENV"
          mkdir -p \
            "$RUNNER_TEMP/.activity-last-known-good/running" \
            "$RUNNER_TEMP/.activity-last-known-good/cycling"
          cp public/data/running/metadata.json \
            "$RUNNER_TEMP/.activity-last-known-good/running/activities.json"
          cp public/data/cycling/metadata.json \
            "$RUNNER_TEMP/.activity-last-known-good/cycling/activities.json"

      - name: Prepare an isolated running candidate
        run: |
          rm -f run_page/data.db src/static/activities.json imported.json
          rm -rf activities GPX_OUT TCX_OUT FIT_OUT
          mkdir -p activities GPX_OUT TCX_OUT FIT_OUT src/static

      - name: Sync Keep running data
        run: |
          python run_page/keep_sync.py \
            "${{ secrets.KEEP_MOBILE }}" \
            "${{ secrets.KEEP_PASSWORD }}" \
            --with-gpx \
            --sync-types running

      - name: Validate the complete running candidate
        run: |
          python run_page/activity_snapshot.py validate \
            --json src/static/activities.json \
            --db run_page/data.db \
            --previous-json "$RUNNER_TEMP/.activity-last-known-good/running/activities.json" \
            --metadata "$RUNNER_TEMP/running-activity-snapshot.json"

      - name: Generate profile-driven running artifacts
        run: |
          node scripts/generate-activity-artifacts.mjs generate \
            --mode running \
            --input src/static/activities.json \
            --published-at "$PUBLICATION_TIMESTAMP" \
            --data-output public/data \
            --assets-output assets \
            --python python \
            --athlete "$ATHLETE" \
            --birth-month "$BIRTHDAY_MONTH"

      - name: Load the cycling publication profile
        run: |
          node scripts/generate-activity-artifacts.mjs export-profile \
            --mode cycling \
            --github-env "$GITHUB_ENV"

      - name: Prepare an isolated cycling candidate
        run: |
          rm -f run_page/data.db src/static/activities.json imported.json
          rm -rf activities GPX_OUT TCX_OUT FIT_OUT
          mkdir -p activities GPX_OUT TCX_OUT FIT_OUT src/static

      - name: Sync Keep cycling data
        run: |
          python run_page/keep_sync.py \
            "${{ secrets.KEEP_MOBILE }}" \
            "${{ secrets.KEEP_PASSWORD }}" \
            --sync-types cycling \
            --min-distance "$ACTIVITY_MIN_DISTANCE_METERS"
          python run_page/filter_activity_data.py \
            --types $ACTIVITY_TYPES \
            --min-distance "$ACTIVITY_MIN_DISTANCE_METERS" \
            --exclude-run-ids $ACTIVITY_EXCLUDE_RUN_IDS

      - name: Sync manual GPX cycling data
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "manual_gpx/taihu_route.polyline.b64" ]; then
            python run_page/write_taihu_manual_gpx.py
          fi
          if compgen -G "manual_gpx/*.gpx" > /dev/null; then
            cp manual_gpx/*.gpx GPX_OUT/
          fi
          if compgen -G "GPX_OUT/*.gpx" > /dev/null; then
            python run_page/gpx_sync.py
            python run_page/filter_activity_data.py \
              --types $ACTIVITY_TYPES \
              --min-distance "$ACTIVITY_MIN_DISTANCE_METERS" \
              --exclude-run-ids $ACTIVITY_EXCLUDE_RUN_IDS
          else
            echo "No manual GPX cycling data found."
          fi

      - name: Backfill missing historical cycling tracks
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G "manual_backfill/*.json" > /dev/null; then
            python run_page/backfill_activity_data.py manual_backfill/*.json
            python run_page/filter_activity_data.py \
              --types $ACTIVITY_TYPES \
              --min-distance "$ACTIVITY_MIN_DISTANCE_METERS" \
              --exclude-run-ids $ACTIVITY_EXCLUDE_RUN_IDS
          else
            echo "No manual backfill cycling data found."
          fi

      - name: Validate the complete cycling candidate
        run: |
          python run_page/activity_snapshot.py validate \
            --json src/static/activities.json \
            --db run_page/data.db \
            --previous-json "$RUNNER_TEMP/.activity-last-known-good/cycling/activities.json" \
            --metadata "$RUNNER_TEMP/cycling-activity-snapshot.json"

      - name: Generate profile-driven cycling artifacts
        run: |
          node scripts/generate-activity-artifacts.mjs generate \
            --mode cycling \
            --input src/static/activities.json \
            --published-at "$PUBLICATION_TIMESTAMP" \
            --data-output public/data \
            --assets-output assets \
            --python python \
            --athlete "$ATHLETE" \
            --birth-month "$BIRTHDAY_MONTH"

      - name: Verify both namespaces before changing the repository
        run: |
          node scripts/generate-activity-artifacts.mjs verify \
            --data-output public/data \
            --assets-output assets

      - name: Commit both validated modes atomically
        id: push
        shell: bash
        run: |
          set -euo pipefail
          git config --local user.email 'action@github.com'
          git config --local user.name 'GitHub Action'
          git add public/data assets/running assets/cycling
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
          else
            git commit -m 'publish validated running and cycling artifacts'
            git push
          fi
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: activity-snapshots-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/running-activity-snapshot.json
            ${{ runner.temp }}/cycling-activity-snapshot.json
          retention-days: 30

  publish_pages:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.pages_mode != 'none' }}
    name: Publish explicitly requested GitHub Pages mode
    needs: sync
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/gh-pages.yml
    with:
      deployment_mode: ${{ inputs.pages_mode }}
      source_sha: ${{ needs.sync.outputs.source_sha }}
